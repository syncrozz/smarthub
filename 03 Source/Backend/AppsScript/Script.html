<script>

let staffData = [];
let filteredData = [];
let searchTimer = null;

/* ===========================
   INIT
=========================== */

google.script.run
  .withSuccessHandler(initPage)
  .withFailureHandler(showError)
  .getStaff();

function initPage(data){

    staffData = Array.isArray(data) ? data : [];

    console.log(staffData[0]);

    console.log(Object.keys(staffData[0]));

    console.log(staffData[0].daerahAsal);

    console.log("PHOTO =", staffData[0].photo);

    filteredData = [...staffData];

    updateDashboard();

    populateDepartmentFilter();

    renderStaff(filteredData);

    updateLastSync();

}

/* ===========================
   DASHBOARD
=========================== */

function updateDashboard(){

    const totalStaff =
        document.getElementById("totalStaff");

    if(totalStaff){

        totalStaff.textContent =
            staffData.length;

    }

    const departments = new Set();

    staffData.forEach(staff=>{

        if(staff.bahagian){

            const bahagian = String(staff.bahagian || "").trim();

if (bahagian) {
    departments.add(bahagian);
}

        }

    });

    const totalDept =
        document.getElementById("totalDept");

    if(totalDept){

        totalDept.textContent =
            departments.size;

    }

}

/* ===========================
   LAST SYNC
=========================== */

function updateLastSync(){

    const el =
        document.getElementById("lastSync");

    if(!el) return;

    el.textContent =
        "Last Update : " +

        new Date().toLocaleString("en-GB");

}

/* ===========================
   FILTER
=========================== */

function populateDepartmentFilter(){

    const select =
        document.getElementById(
            "departmentFilter"
        );

    if(!select) return;

    const departments = [

        ...new Set(

            staffData

                .map(
                    x=>x.bahagian
                )

                .filter(Boolean)

        )

    ].sort();

    select.innerHTML =

        `<option value="">

            Semua Bahagian

        </option>`;

    departments.forEach(dept=>{

        select.innerHTML +=

        `<option value="${dept}">

            ${dept}

        </option>`;

    });

}
/* ===========================
   RENDER STAFF
=========================== */

function renderStaff(data){

    const container =
        document.getElementById("staffList");

    if(!container) return;

    if(data.length===0){

        container.innerHTML = `

        <div class="col-12">

            <div class="empty">

                <i class="bi bi-search fs-1"></i>

                <h4 class="mt-3">

                    Tiada Rekod Dijumpai

                </h4>

                <p>

                    Cuba ubah carian atau penapis.

                </p>

            </div>

        </div>

        `;

    }else{

        container.innerHTML =
            data.map(createStaffCard).join("");

    }

    const badge =
        document.getElementById("staffCount");

    if(badge){

        badge.textContent = data.length;

    }

}
function getDepartmentShortName(department){

    if(!department) return "-";

    const map = {

        "Bahagian Pengurusan":"Pengurusan",

        "Jabatan Pengajian Am":"Pengajian Am",

        "Jabatan Pengurusan Perniagaan":"Pengurusan Perniagaan",

        "Jabatan Perakaunan":"Perakaunan",

        "Jabatan Sains Kuantitatif":"Sains Kuantitatif",

        "Unit Kaunseling":"Kaunseling",

        "Unit Ko-Kurikulum":"Ko-Kurikulum",

        "Unit Felo":"Felo"

    };

    return map[department] || department;

}

function getGradeClass(grade){

    console.log("GRADE =", grade);
    console.log("TYPE =", typeof grade);

    if(!grade) return "";

    grade = String(grade);

    return "grade-" + grade.toLowerCase();

}

function createStaffCard(staff){
   
    console.log(staff);
    console.log("Gred:", staff.gred);

    return `

<div class="col-xl-4 col-lg-4 col-md-6 col-6 mb-4">

<div
    class="staff-card fade-in"
    role="button"
    tabindex="0"
    onclick="showProfile('${staff.id}')">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-start mb-3">

        <div class="d-flex gap-2 flex-wrap">

            <span class="badge-grade ${getGradeClass(staff.gred)}">

                ${staff.gred || "-"}

            </span>

            <span class="badge-department ${getDepartmentClass(staff.bahagian)}">

                ${getDepartmentShortName(staff.bahagian)}

            </span>

        </div>

        <div class="staff-arrow">

            <i class="bi bi-chevron-right"></i>

        </div>

    </div>

    <!-- Content -->

    <div class="d-flex align-items-center">

        <img
            src="${staff.photo}"
            class="staff-avatar me-3"
            loading="lazy"
            onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">

        <div class="flex-grow-1">

            <h3 class="staff-name">

                ${staff.nama || "-"}

            </h3>

            <div class="staff-position">

                ${staff.jawatan || "-"}

            </div>

        </div>

    </div>

    <!-- Contact -->

     <div class="staff-contact mt-4">

        <div class="contact-chip">

    <i class="bi bi-telephone"></i>

    <a
        href="tel:${staff.telefon}"
        class="text-decoration-none">

        ${staff.telefon || "-"}

    </a>

</div>

<div class="contact-chip">

    ${staff.sambungan || "-"}

</div>

    </div>

</div>

</div>

`;

}
/* ===========================
   PROFILE
=========================== */

function formatList(text){

    return (text || "-")
        .replace(/,\s*(\d+\s*-\s*)/g, "<br>$1");

}

function showProfile(id){

    const staff = staffData.find(
        x => String(x.id) === String(id)
    );

    if(!staff) return;

    console.log("STAFF =", staff);
    console.log("DAERAH =", staff.daerahAsal);

    console.log(staff);

    document.getElementById("modalNama").textContent =
        staff.nama || "-";

    document.getElementById("modalJawatan").textContent =
        staff.jawatan || "-";

    document.getElementById("modalJawatanInfo").textContent =
        staff.jawatan || "-";

    document.getElementById("modalGred").textContent =
        staff.gred || "-";

    document.getElementById("modalPhoto").src =
        staff.photo || CONFIG.DEFAULT_AVATAR;

    document.getElementById("modalBahagian").textContent =
        staff.bahagian || "-";

    document.getElementById("modalTelefon").textContent =
        staff.telefon || "-";

    document.getElementById("modalKelulusan").innerHTML =
        formatList(staff.kelulusan);

    document.getElementById("modalPengkhususan").innerHTML =
        formatList(staff.pengkhususan);

    document.getElementById("modalDaerahAsal").textContent =
        staff.daerahAsal || "-";

    /* Email */

    const email =
        document.getElementById("modalEmail");

    if(staff.email){

        email.innerHTML = `

        <a href="mailto:${staff.email}">

            ${staff.email}

        </a>

        `;

    }else{

        email.textContent="-";

    }

    /* WhatsApp */

    const whatsapp =
        document.getElementById("modalWhatsapp");

    if(staff.whatsapp){

        whatsapp.innerHTML = `

        <a
            class="btn btn-success btn-sm"

            target="_blank"

            href="https://wa.me/${staff.whatsapp}">

            <i class="bi bi-whatsapp"></i>

            WhatsApp

        </a>

        `;

    }else{

        whatsapp.textContent="-";

    }
/* Committee */

document
    .getElementById("btnCommittee")
    .onclick = () => {

        showCommittee(staff.id);

    };
    new bootstrap.Modal(

        document.getElementById("profileModal")

    ).show();

}
function showCommittee(staffId){

    google.script.run
        .withSuccessHandler(renderCommittee)
        .withFailureHandler(showError)
        .getStaffCommittee(staffId);

}
function renderCommittee(data){

    const container =
        document.getElementById("committeeContent");

    container.innerHTML = "";

    if(!data || data.length === 0){

        container.innerHTML = `
            <div class="alert alert-warning">
                Tiada rekod jawatan ditemui.
            </div>
        `;

    }else{

        document.getElementById("committeeNama").textContent =
            document.getElementById("modalNama").textContent;
            
function getPriority(jawatan){

    jawatan = (jawatan || "").toLowerCase();

    if(jawatan.includes("pengerusi")) return 1;
    if(jawatan.includes("timbalan pengerusi")) return 2;
    if(jawatan.includes("naib pengerusi")) return 3;

    if(jawatan.includes("pengarah")) return 5;

    if(jawatan.includes("penasihat")) return 10;

    if(jawatan.includes("ketua felo")) return 20;
    if(jawatan.includes("ketua")) return 21;

    if(jawatan.includes("setiausaha")) return 30;
    if(jawatan.includes("bendahari")) return 40;

    if(jawatan.includes("penyelaras")) return 50;
    if(jawatan.includes("koordinator")) return 51;

    if(jawatan.includes("ajk")) return 90;
    if(jawatan.includes("ahli")) return 100;

    return 999;

}

data.sort((a,b)=> getPriority(a.Jawatan) - getPriority(b.Jawatan));

        data.forEach(item=>{

            container.innerHTML += `

                <div class="card mb-3 shadow-sm">

                    <div class="card-body">

                        <span class="committee-badge">

                            ${item.Kategori}

                        </span>

                        <h5 class="mt-3">

                            ${item.Jawatan}

                        </h5>

                        <p class="text-muted mb-1">

                            <i class="bi bi-building"></i>

                            ${item.Unit}

                        </p>

                        <small>

                            Tahun : ${item.Tahun}

                        </small>

                    </div>

                </div>

            `;

        });

    }

    bootstrap.Modal
        .getInstance(
            document.getElementById("profileModal")
        )
        .hide();

    new bootstrap.Modal(
        document.getElementById("committeeModal")
    ).show();

}
/* ===========================
   SEARCH
=========================== */

function applyFilters(){

    const keyword =
        (document.getElementById("searchInput")?.value || "")
            .trim()
            .toLowerCase();

    const department =
        document.getElementById("departmentFilter")?.value || "";

    filteredData = staffData.filter(staff => {

        const matchKeyword =

            (staff.nama || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.jawatan || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.gred || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.bahagian || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.email || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.telefon || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.pengkhususan || "")
                .toLowerCase()
                .includes(keyword)

            ||

            (staff.daerahAsal || "")
                .toLowerCase()
                .includes(keyword)

            ||

            String(staff.tahunLahir || "")
                .toLowerCase()
                .includes(keyword)

            ||

            String(staff.platNo1 || "")
                .toLowerCase()
                .includes(keyword)

            ||

            String(staff.platNo2 || "")
                .toLowerCase()
                .includes(keyword)

            ||

            String(staff.platNo3 || "")
                .toLowerCase()
                .includes(keyword);

        const matchDepartment =
            !department ||
            staff.bahagian === department;

        return matchKeyword && matchDepartment;

    });

    renderStaff(filteredData);

}
        
/* ===========================
   ERROR
=========================== */

function showError(err){

    console.error(err);

    const container =
        document.getElementById("staffList");

    if(container){

        container.innerHTML = `

        <div class="col-12">

            <div class="alert alert-danger">

                <h5>

                    <i class="bi bi-exclamation-triangle"></i>

                    Ralat Memuatkan Data

                </h5>

                <hr>

                ${err.message || err}

            </div>

        </div>

        `;

    }

}

function getDepartmentClass(department){

    if(!department) return "dept-default";

    const map = {

        "Bahagian Pengurusan":"dept-management",

        "Jabatan Pengajian Am":"dept-academic",

        "Jabatan Pengurusan Perniagaan":"dept-business",

        "Jabatan Perakaunan":"dept-accounting",

        "Jabatan Sains Kuantitatif":"dept-quantitative",

        "Unit Kaunseling":"dept-counselling",

        "Unit Ko-Kurikulum":"dept-cocurriculum",

        "Unit Felo":"dept-fellow"

    };

    return map[department] || "dept-default";

}

/* ===========================
   EVENT LISTENER
=========================== */

document.addEventListener("DOMContentLoaded",()=>{

    const searchInput  =
        document.getElementById("searchInput");

    if(searchInput ){

        searchInput .addEventListener("input",()=>{

            clearTimeout(searchTimer);

            searchTimer =
                setTimeout(
                    applyFilters,
                    250
                );

        });

    }

    const departmentFilter =
        document.getElementById("departmentFilter");

    if(departmentFilter){

        departmentFilter.addEventListener(

            "change",

            applyFilters

        );

    }

});
/*=====================================================
  RESET TOOLBAR
=====================================================*/

function resetToolbar(){

    document.getElementById("searchInput").value = "";

    document.getElementById("departmentFilter").value = "";

    renderStaff(staffData);

}
</script>
